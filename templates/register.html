{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block public_content %}<section class="auth-wrap"><div class="auth-card"><a class="back-link" href="{{ url_for('index') }}">← Back home</a><div class="auth-symbol">✦</div><span class="eyebrow">START YOUR JOURNEY</span><h1>Make money make sense.</h1><p class="auth-subtitle">Create your private account to get started.</p><form method="post" class="form-stack"><label>Your name<input type="text" name="name" placeholder="How should we call you?" autocomplete="name" maxlength="100" required></label><label>Email address<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label><label>Password<input type="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required></label><button class="button button-primary button-full" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
